<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Statistics Dashboard - Karnataka Scholarship Portal</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; padding: 20px; }
        .container { max-width: 1400px; margin: 0 auto; }
        h1 { color: white; text-align: center; margin-bottom: 30px; font-size: 2.5rem; }
        .nav-link { display: inline-block; color: white; text-decoration: none; padding: 10px 20px; background: rgba(255,255,255,0.2); border-radius: 5px; margin-bottom: 20px; }
        .nav-link:hover { background: rgba(255,255,255,0.3); }
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; margin-bottom: 30px; }
        .stat-card { background: white; border-radius: 15px; padding: 25px; box-shadow: 0 10px 30px rgba(0,0,0,0.2); text-align: center; }
        .stat-card h3 { color: #666; font-size: 0.9rem; margin-bottom: 10px; text-transform: uppercase; }
        .stat-card .value { font-size: 2.5rem; font-weight: bold; color: #667eea; }
        .charts-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(400px, 1fr)); gap: 20px; margin-bottom: 20px; }
        .chart-card { background: white; border-radius: 15px; padding: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.2); }
        .chart-card h2 { color: #333; margin-bottom: 15px; font-size: 1.2rem; }
        .chart-container { position: relative; height: 300px; }
    </style>
</head>
<body>
    <div class="container">
        <a href="/" class="nav-link">← Back to Home</a>
        <h1>📊 Statistics Dashboard</h1>
        
        <div class="stats-grid">
            <div class="stat-card"><h3>Total Scholarships</h3><div class="value" id="total-scholarships">-</div></div>
            <div class="stat-card"><h3>Total Users</h3><div class="value" id="total-users">-</div></div>
            <div class="stat-card"><h3>Total Applications</h3><div class="value" id="total-applications">-</div></div>
            <div class="stat-card"><h3>Approved</h3><div class="value" id="approved-applications">-</div></div>
            <div class="stat-card"><h3>Pending</h3><div class="value" id="pending-applications">-</div></div>
            <div class="stat-card"><h3>Approval Rate</h3><div class="value" id="approval-rate">-</div></div>
            <div class="stat-card"><h3>Total Visits</h3><div class="value" id="total-visits">-</div></div>
        </div>

        <div class="charts-grid">
            <div class="chart-card"><h2>Applications by Status</h2><div class="chart-container"><canvas id="applicationStatusChart"></canvas></div></div>
            <div class="chart-card"><h2>Scholarships by Course</h2><div class="chart-container"><canvas id="scholarshipCourseChart"></canvas></div></div>
            <div class="chart-card"><h2>Users by Gender</h2><div class="chart-container"><canvas id="userGenderChart"></canvas></div></div>
            <div class="chart-card"><h2>Users by District</h2><div class="chart-container"><canvas id="userDistrictChart"></canvas></div></div>
            <div class="chart-card"><h2>Applications by User</h2><div class="chart-container"><canvas id="applicationByUserChart"></canvas></div></div>
        </div>
    </div>

    <script>
        const colors = ['#667eea', '#764ba2', '#f093fb', '#f5576c', '#4facfe', '#00f2fe', '#43e97b', '#38f9d7'];
        let charts = {};

        async function loadSummary() {
            try {
                const response = await fetch('/api/stats/summary');
                const data = await response.json();
                document.getElementById('total-scholarships').textContent = data.total_scholarships || 0;
                document.getElementById('total-users').textContent = data.total_users || 0;
                document.getElementById('total-applications').textContent = data.total_applications || 0;
                document.getElementById('approved-applications').textContent = data.approved_applications || 0;
                document.getElementById('pending-applications').textContent = data.pending_applications || 0;
                document.getElementById('approval-rate').textContent = (data.approval_rate || 0) + '%';
                document.getElementById('total-visits').textContent = data.total_visits || 0;
            } catch (error) { console.error('Error loading summary:', error); }
        }

        async function loadApplicationStats() {
            try {
                const response = await fetch('/api/stats/applications');
                const data = await response.json();
                const ctx = document.getElementById('applicationStatusChart').getContext('2d');
                if (charts.applicationStatus) charts.applicationStatus.destroy();
                const labels = Object.keys(data.by_status || {});
                const values = Object.values(data.by_status || {});
                if (labels.length === 0 || values.every(v => v === 0)) {
                    ctx.font = '16px Arial'; ctx.textAlign = 'center'; ctx.fillStyle = '#666';
                    ctx.fillText('No applications yet', ctx.canvas.width / 2, ctx.canvas.height / 2); return;
                }
                charts.applicationStatus = new Chart(ctx, { type: 'pie', data: { labels: labels, datasets: [{ data: values, backgroundColor: colors, borderWidth: 2, borderColor: '#fff' }] }, options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'bottom' } } } });
            } catch (error) { console.error('Error loading application stats:', error); }
        }

        async function loadScholarshipStats() {
            try {
                const response = await fetch('/api/stats/scholarships');
                const data = await response.json();
                const courseCtx = document.getElementById('scholarshipCourseChart').getContext('2d');
                if (charts.scholarshipCourse) charts.scholarshipCourse.destroy();
                const courseLabels = Object.keys(data.by_course || {});
                const courseValues = Object.values(data.by_course || {});
                charts.scholarshipCourse = new Chart(courseCtx, { type: 'bar', data: { labels: courseLabels, datasets: [{ label: 'Scholarships', data: courseValues, backgroundColor: colors[0], borderRadius: 5 }] }, options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { y: { beginAtZero: true } } } });
            } catch (error) { console.error('Error loading scholarship stats:', error); }
        }

        async function loadUserStats() {
            try {
                const response = await fetch('/api/stats/users');
                const data = await response.json();
                const genderCtx = document.getElementById('userGenderChart').getContext('2d');
                if (charts.userGender) charts.userGender.destroy();
                const genderLabels = Object.keys(data.by_gender || {});
                const genderValues = Object.values(data.by_gender || {});
                charts.userGender = new Chart(genderCtx, { type: 'pie', data: { labels: genderLabels, datasets: [{ data: genderValues, backgroundColor: [colors[0], colors[1], colors[2]], borderWidth: 2, borderColor: '#fff' }] }, options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'bottom' } } } });
                const districtCtx = document.getElementById('userDistrictChart').getContext('2d');
                if (charts.userDistrict) charts.userDistrict.destroy();
                const districtLabels = Object.keys(data.by_district || {});
                const districtValues = Object.values(data.by_district || {});
                charts.userDistrict = new Chart(districtCtx, { type: 'bar', data: { labels: districtLabels, datasets: [{ label: 'Users', data: districtValues, backgroundColor: colors[2], borderRadius: 5 }] }, options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { y: { beginAtZero: true } } } });
            } catch (error) { console.error('Error loading user stats:', error); }
        }

        async function loadApplicationByUserStats() {
            try {
                const response = await fetch('/api/stats/applications-by-user');
                const data = await response.json();
                const ctx = document.getElementById('applicationByUserChart').getContext('2d');
                if (charts.applicationByUser) charts.applicationByUser.destroy();
                const labels = Object.keys(data.by_user || {});
                const values = Object.values(data.by_user || {});
                if (labels.length === 0 || values.every(v => v === 0)) {
                    ctx.font = '16px Arial'; ctx.textAlign = 'center'; ctx.fillStyle = '#666';
                    ctx.fillText('No applications yet', ctx.canvas.width / 2, ctx.canvas.height / 2); return;
                }
                charts.applicationByUser = new Chart(ctx, { type: 'bar', data: { labels: labels, datasets: [{ label: 'Applications', data: values, backgroundColor: colors[3], borderRadius: 5 }] }, options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { y: { beginAtZero: true } } } });
            } catch (error) { console.error('Error loading application by user stats:', error); }
        }

        window.addEventListener('load', () => { loadSummary(); loadApplicationStats(); loadScholarshipStats(); loadUserStats(); loadApplicationByUserStats(); });
    </script>
</body>
</html>
