<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Profile - Karnataka Scholarship Portal</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }

        .edit-container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            width: 100%;
            max-width: 700px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
            margin-top: 20px;
        }

        .edit-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .edit-header h1 {
            color: #333;
            font-size: 28px;
            margin-bottom: 10px;
        }

        .edit-header p {
            color: #666;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 500;
            font-size: 14px;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid #e1e1e1;
            border-radius: 10px;
            font-size: 15px;
            transition: all 0.3s ease;
            background: #f9f9f9;
        }

        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: #667eea;
            background: white;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .btn-group {
            display: flex;
            gap: 15px;
            margin-top: 30px;
        }

        .btn {
            flex: 1;
            padding: 16px;
            border-radius: 10px;
            border: none;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            transition: all 0.3s ease;
            text-decoration: none;
            text-align: center;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }

        .btn-secondary {
            background: #6c757d;
            color: white;
        }

        .btn-secondary:hover {
            background: #5a6268;
        }

        .flash-messages {
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
        }

        .flash-success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .flash-error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        @media (max-width: 768px) {
            .form-row {
                grid-template-columns: 1fr;
            }
            
            .btn-group {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div class="edit-container">
        <div class="edit-header">
            <h1>✏️ Edit Profile</h1>
            <p>Update your personal information</p>
        </div>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="flash-messages flash-{{ category }}">
                        {{ message }}
                    </div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form method="POST" action="/profile/edit">
            <div class="form-row">
                <div class="form-group">
                    <label for="first_name">First Name *</label>
                    <input type="text" id="first_name" name="first_name" value="{{ user.first_name }}" required>
                </div>
                <div class="form-group">
                    <label for="last_name">Last Name</label>
                    <input type="text" id="last_name" name="last_name" value="{{ user.last_name or '' }}">
                </div>
            </div>

            <div class="form-group">
                <label for="phone">Phone Number</label>
                <input type="tel" id="phone" name="phone" value="{{ user.phone or '' }}" placeholder="Enter phone number">
            </div>

            <div class="form-group">
                <label for="dob">Date of Birth</label>
                <input type="date" id="dob" name="dob" value="{{ user.date_of_birth.strftime('%Y-%m-%d') if user.date_of_birth else '' }}">
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="gender">Gender</label>
                    <select id="gender" name="gender">
                        <option value="">Select Gender</option>
                        <option value="Male" {% if user.gender == 'Male' %}selected{% endif %}>Male</option>
                        <option value="Female" {% if user.gender == 'Female' %}selected{% endif %}>Female</option>
                        <option value="Other" {% if user.gender == 'Other' %}selected{% endif %}>Other</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="caste">Caste Category</label>
                    <select id="caste" name="caste">
                        <option value="">Select Category</option>
                        <option value="General" {% if user.caste == 'General' %}selected{% endif %}>General</option>
                        <option value="OBC" {% if user.caste == 'OBC' %}selected{% endif %}>OBC</option>
                        <option value="SC" {% if user.caste == 'SC' %}selected{% endif %}>SC</option>
                        <option value="ST" {% if user.caste == 'ST' %}selected{% endif %}>ST</option>
                    </select>
                </div>
            </div>

            <div class="form-group">
                <label for="district">District</label>
                <select id="district" name="district">
                    <option value="">Select District</option>
                    <option value="Bagalkot" {% if user.district == 'Bagalkot' %}selected{% endif %}>Bagalkot</option>
                    <option value="Bangalore Rural" {% if user.district == 'Bangalore Rural' %}selected{% endif %}>Bangalore Rural</option>
                    <option value="Bangalore Urban" {% if user.district == 'Bangalore Urban' %}selected{% endif %}>Bangalore Urban</option>
                    <option value="Belagavi" {% if user.district == 'Belagavi' %}selected{% endif %}>Belagavi</option>
                    <option value="Ballari" {% if user.district == 'Ballari' %}selected{% endif %}>Ballari</option>
                    <option value="Bidar" {% if user.district == 'Bidar' %}selected{% endif %}>Bidar</option>
                    <option value="Chikkaballapur" {% if user.district == 'Chikkaballapur' %}selected{% endif %}>Chikkaballapur</option>
                    <option value="Chikkamagaluru" {% if user.district == 'Chikkamagaluru' %}selected{% endif %}>Chikkamagaluru</option>
                    <option value="Chitradurga" {% if user.district == 'Chitradurga' %}selected{% endif %}>Chitradurga</option>
                    <option value="Dakshina Kannada" {% if user.district == 'Dakshina Kannada' %}selected{% endif %}>Dakshina Kannada</option>
                    <option value="Davanagere" {% if user.district == 'Davanagere' %}selected{% endif %}>Davanagere</option>
                    <option value="Dharwad" {% if user.district == 'Dharwad' %}selected{% endif %}>Dharwad</option>
                    <option value="Gadag" {% if user.district == 'Gadag' %}selected{% endif %}>Gadag</option>
                    <option value="Kalaburagi" {% if user.district == 'Kalaburagi' %}selected{% endif %}>Kalaburagi</option>
                    <option value="Hassan" {% if user.district == 'Hassan' %}selected{% endif %}>Hassan</option>
                    <option value="Haveri" {% if user.district == 'Haveri' %}selected{% endif %}>Haveri</option>
                    <option value="Hubli-Dharwad" {% if user.district == 'Hubli-Dharwad' %}selected{% endif %}>Hubli-Dharwad</option>
                    <option value="Kolar" {% if user.district == 'Kolar' %}selected{% endif %}>Kolar</option>
                    <option value="Koppal" {% if user.district == 'Koppal' %}selected{% endif %}>Koppal</option>
                    <option value="Mandya" {% if user.district == 'Mandya' %}selected{% endif %}>Mandya</option>
                    <option value="Mysuru" {% if user.district == 'Mysuru' %}selected{% endif %}>Mysuru</option>
                    <option value="Raichur" {% if user.district == 'Raichur' %}selected{% endif %}>Raichur</option>
                    <option value="Ramanagara" {% if user.district == 'Ramanagara' %}selected{% endif %}>Ramanagara</option>
                    <option value="Shivamogga" {% if user.district == 'Shivamogga' %}selected{% endif %}>Shivamogga</option>
                    <option value="Tumakuru" {% if user.district == 'Tumakuru' %}selected{% endif %}>Tumakuru</option>
                    <option value="Udupi" {% if user.district == 'Udupi' %}selected{% endif %}>Udupi</option>
                    <option value="Uttara Kannada" {% if user.district == 'Uttara Kannada' %}selected{% endif %}>Uttara Kannada</option>
                    <option value="Vijayanagar" {% if user.district == 'Vijayanagar' %}selected{% endif %}>Vijayanagar</option>
                    <option value="Yadgir" {% if user.district == 'Yadgir' %}selected{% endif %}>Yadgir</option>
                </select>
            </div>

            <div class="btn-group">
                <button type="submit" class="btn btn-primary">💾 Save Changes</button>
                <a href="/profile" class="btn btn-secondary">Cancel</a>
            </div>
        </form>
    </div>
</body>
</html>
